[package]
name = "my-axum-app"
version = "0.1.0"
edition = "2024"
# 项目含多个 bin（my-axum-app / openapi），指定默认入口，
# 否则 `cargo run` 与 `cargo watch -x run` 会因歧义报错
default-run = "my-axum-app"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "set-header",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"
# vendored: 内置 Swagger UI 静态资源，避免构建时从 GitHub 下载
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[lib]
name = "my_axum_app"
path = "src/lib.rs"
